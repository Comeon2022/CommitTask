name: Terraform PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate bootstrap
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
      - name: Validate PoC
        working-directory: terraform/poc
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

  plan:
    name: Plan PoC (trusted same-repo PR only)
    needs: validate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: gcp-plan
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_candidate_full_name: ${{ vars.TF_CANDIDATE_FULL_NAME }}
      TF_VAR_container_image: ${{ vars.TF_CONTAINER_IMAGE }}
      TF_VAR_deployed_commit: ${{ vars.TF_DEPLOYED_COMMIT }}
      TF_STATE_BUCKET: ${{ vars.GCS_TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Validate configuration variables
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          for value in "$TF_VAR_project_id" "$TF_VAR_candidate_full_name" "$TF_VAR_container_image" "$TF_VAR_deployed_commit" "$TF_STATE_BUCKET" "$WIF_PROVIDER" "$DEPLOYER_SA"; do
            if [ -z "$value" ]; then
              echo "::error::Required GitHub Actions variable is missing; see docs/CI-CD.md"
              exit 1
            fi
          done
      - name: Authenticate to Google Cloud (no JSON key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Initialize GCS backend
        working-directory: terraform/poc
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="prefix=meridian/poc"
      - name: Terraform plan (never apply)
        working-directory: terraform/poc
        run: terraform plan -input=false -lock=false -no-color

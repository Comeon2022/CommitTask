name: Build and publish API image (main)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: image-publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push immutable image
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.GCP_BUILD_WIF_PROVIDER }}
      BUILDER_SA: ${{ vars.GCP_BUILD_SA }}
      IMAGE_NAME: europe-west1-docker.pkg.dev/commitask/meridian-poc/api
    steps:
      - name: Check non-secret configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "commitask"
          test -n "$WIF_PROVIDER"
          test "$BUILDER_SA" = "meridian-poc-builder@commitask.iam.gserviceaccount.com"

      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate as repository-scoped builder (no JSON keys)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_BUILD_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry with short-lived access token
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (commit-pinned)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=min

      - name: Publish immutable image reference and source SHA
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          IMAGE_REF="${IMAGE_NAME}@${DIGEST}"
          {
            echo "## Published image"
            echo ""
            echo "- **Source commit:** \`$SOURCE_SHA\`"
            echo "- **Immutable image:** \`$IMAGE_REF\`"
            echo "- **Builder SA:** \`$BUILDER_SA\` (Artifact Registry writer on repository only)"
            echo ""
            echo "No infrastructure apply or Cloud Run deployment was performed."
          } >> "$GITHUB_STEP_SUMMARY"
